<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>LifeBook · Search</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link href="main.css" rel="stylesheet">
</head>
<body data-page="search">

<div id="app">
  <!-- SEARCH PAGE -->
  <div id="search-page">
    <div class="search-input-wrap">
      <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      <input type="text" id="search-input" placeholder="Search activities, mentors, categories..." autofocus>
      <button class="search-clear-btn" id="search-clear" style="display:none">✕</button>
    </div>

    <div class="search-tags">
      <span class="search-tag" data-filter="category">Category</span>
      <span class="search-tag" data-filter="mentor">Mentor</span>
      <span class="search-tag" data-filter="post">Post</span>
    </div>

    <div id="search-history-section">
      <div class="search-history-header">
        <span>Recent Searches</span>
      </div>
      <div id="search-history-list"></div>
    </div>

    <div id="search-results" style="display:none"></div>
    <div id="search-empty" class="search-empty" style="display:none">No results found</div>
  </div>

  <!-- BOTTOM NAV -->
  <div id="bottom-nav"></div>
</div>

<!-- TOAST CONTAINER -->
<div class="toast-container" id="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="activities.js"></script>
<script src="navbar.js"></script>
<script src="app.js"></script>
<script src="search.js"></script>
</body>
</html>
